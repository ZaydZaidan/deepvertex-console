name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Pakai python3 SISTEM seperti mesin lapangan: PyGObject (python3-gi) hanya
      # tersedia via apt dan dibutuhkan video.py (GStreamer).
      - name: System packages (GStreamer + PyGObject + Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-pip python3-gi python3-gi-cairo gir1.2-glib-2.0 gir1.2-gst-plugins-base-1.0 \
            gstreamer1.0-tools gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav libxcb-cursor0 xvfb ffmpeg

      - name: Python packages
        run: python3 -m pip install --break-system-packages PySide6 numpy pymavlink

      - name: Compile everything
        run: |
          python3 -m py_compile gui_t1/*.py onboard/raw_agent.py tests/*.py

      - name: Start RAW agent (test mode)
        run: |
          python3 onboard/raw_agent.py --test --port 8791 &
          sleep 2
          curl -fsS http://127.0.0.1:8791/status > /dev/null

      - name: Console suite (headless)
        working-directory: gui_t1
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" python3 ../tests/test_console.py

      - name: Video + RAW suites
        working-directory: gui_t1
        run: |
          xvfb-run -a python3 ../tests/test_video.py
          xvfb-run -a python3 ../tests/test_raw.py

  # Windows .exe distribution (PyInstaller one-file). Built ON Windows by GitHub
  # Actions (cross-build is impossible) and attached to the release when a v*
  # tag is pushed. Scope note: gamepad reading is Linux evdev -> the .EXE runs
  # telemetry + streams (GStreamer runtime must be installed separately) + the
  # capture suite, with the gamepad side disabled.
  windows-exe:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write          # release upload
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 numpy pymavlink pyinstaller

      - name: Sanity import (headless, offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python gui_t1/windows_entry.py --help

      - name: Build one-file exe
        shell: pwsh
        run: |
          pyinstaller `
            --name DeepVertexMarineConsole `
            --onefile `
            --windowed `
            --icon gui_t1/ikon/deepvertex-app-icon.ico `
            --add-data "gui_t1/ikon;ikon" `
            --add-data "gui_t1/fonts;fonts" `
            --collect-all pymavlink `
            --paths gui_t1 `
            gui_t1/windows_entry.py
          ls dist

      - name: Build debug (console) exe
        shell: pwsh
        run: |
          pyinstaller `
            --name DeepVMDebug `
            --onefile `
            --icon gui_t1/ikon/deepvertex-app-icon.ico `
            --add-data "gui_t1/ikon;ikon" `
            --add-data "gui_t1/fonts;fonts" `
            --collect-all pymavlink `
            --paths gui_t1 `
            gui_t1/windows_entry.py
          ls dist

      - uses: actions/upload-artifact@v4
        with:
          name: DeepVertexMarineConsole-windows-exe
          path: |
            dist/DeepVertexMarineConsole.exe
            dist/DeepVMDebug.exe

      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release upload "${env:GITHUB_REF_NAME}" dist/DeepVertexMarineConsole.exe --clobber
          gh release upload "${env:GITHUB_REF_NAME}" dist/DeepVMDebug.exe --clobber

